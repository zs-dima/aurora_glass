# ignore: prefer-publish-to-none, this package is published.
name: aurora_glass
description: "The Aurora Glass design system for Flutter: tokens, adaptive layer, theme and kit components, with the app's palette passed in."

version: 0.1.0

homepage: https://github.com/zs-dima/aurora_glass
repository: https://github.com/zs-dima/aurora_glass
issue_tracker: https://github.com/zs-dima/aurora_glass/issues

topics:
  - design-system
  - theme
  - ui-kit
  - material
  - adaptive

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

executables:
  gen_brand: gen_brand
  gen_tokens: gen_tokens

environment:
  sdk: ^3.13.2
  # The kit uses `WidgetStateInputBorder`, `Durations`/`Easing` and dot-shorthand enum syntax.
  flutter: ">=3.47.2"

dependencies:
  flutter:
    sdk: flutter

  # Pure-Dart QR encoder (the matrix only; the painting is ours, so the code can be styled like
  # the rest of the kit instead of being a black rectangle dropped on the Aurora chassis).
  # v3, not v4: `pdf` -> `barcode` pins qr ^3 in at least one consuming app and the two cannot
  # coexist. Revisit when barcode releases against qr 4.
  qr: ^3.0.2

  # That is the whole list, verified against imports: flutter + qr. An earlier version carried
  # intl/control/rxdart/uuid/collection/characters/meta with ZERO imports between them, and each
  # was a weekly Dependabot PR in every repository that depended on this one.

dev_dependencies:
  flutter_test:
    sdk: flutter

  lints_tool:
    git:
      url: https://github.com/zs-dima/lints_tool.git
      ref: v1.0.1

flutter:
  uses-material-design: true

  shaders:
    - packages/aurora_glass/shaders/shimmer.frag
    - packages/aurora_glass/shaders/ai/progress.frag

  fonts:
    # Icons are a FONT, not per-file SVGs. An app's own glyphs go in its own family, not in this
    # one; otherwise every app ships every other app's icons.
    - family: icons
      fonts:
        - asset: packages/aurora_glass/fonts/icons.ttf
